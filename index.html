<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Zufälliger Bahnhof</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
    }
    #neu {
      font-size: 24px;       /* große Schrift */
      padding: 15px 40px;    /* größere Fläche */
      cursor: pointer;
      border-radius: 8px;
      background-color: #4CAF50;
      color: white;
      border: none;
      transition: background-color 0.2s;
    }
    #neu:hover {
      background-color: #45a049;
    }
    #output {
      font-size: 36px;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>

<h1 id="output">Lade…</h1>
<button id="neu">Neu</button>

<script>
async function ladeZufall() {
  const response = await fetch('names.txt');
  const text = await response.text();

  // UTF-8-Zeichen sauber behandeln
  const namen = text
    .split('\n')
    .map(n => n.trim())
    .filter(n => n.length > 0);

  const zufall = namen[Math.floor(Math.random() * namen.length)];
  document.getElementById('output').textContent = zufall;
}

// Button klickbar machen
document.getElementById('neu').addEventListener('click', ladeZufall);

// Direkt beim Laden der Seite einen Namen anzeigen
ladeZufall();
</script>

</body>
</html>
