<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Zufälliger Bahnhof</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }

    #output {
      font-size: 2em; /* größerer Text für den String */
      margin-bottom: 30px;
    }

    button {
      font-size: 1.5em;   /* größerer Button */
      padding: 15px 30px; /* mehr Fläche */
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1 id="output"></h1>

<button onclick="neu()">Neu</button>

<script>
  const strings = [
    "Apfel",
    "Bänäne",
    "Kirsche",
    "Ölbaum",
    "Birne",
    "Frage: Wie geht's?",
    "Überraschung"
  ];

  function neu() {
    const zufall = strings[Math.floor(Math.random() * strings.length)];
    document.getElementById("output").textContent = zufall;
  }

  // Zufälliger String direkt beim Laden
  neu();
</script>

</body>
</html>
