<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Zufälliger Name</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
    }
    #output {
      font-size: 2em;
      margin-bottom: 20px;
    }
    #neu {
      font-size: 1.5em;       /* größere Schrift */
      padding: 15px 30px;     /* größerer Button */
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background-color: #4CAF50;
      color: white;
    }
    #neu:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

<h1 id="output">Lade…</h1>
<button id="neu">Neu</button>

<script>
async function ladeZufall() {
  const response = await fetch('names.txt');
  const text = await response.text();

  // Sonderzeichen korrekt trimmen
  const namen = text
    .split(/\r?\n/)
    .map(n => n.trim())
    .filter(n => n.length > 0);

  const zufall = namen[Math.floor(Math.random() * namen.length)];
  document.getElementById('output').textContent = zufall;
}

// Button mit Klick verbinden
document.getElementById('neu').addEventListener('click', ladeZufall);

// Beim Laden gleich einen Namen anzeigen
ladeZufall();
</script>

</body>
</html>
